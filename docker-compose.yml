services:
  frontend-breakit:
    build:
      context: ./frontend
    ports:
    # estrategia de puertos en el mismo host, cambiando solo el puerto
      - "127.0.0.1:${FRONTEND_PORT:-8083}:80"
    volumes:
      - ./frontend/src:/usr/share/nginx/html:ro
    depends_on:
      - backend-breakit
    networks:
      - internal
    restart: unless-stopped

  backend-breakit:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    expose:
      - "3000"
    environment:
      - API_KEY=${API_KEY}

    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
